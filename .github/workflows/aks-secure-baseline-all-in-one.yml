name: AKS Secure Baseline - All-in-One

on:
  push:
    branches:
      - main
    paths:
      - 'Scenarios/AKS-Secure-Baseline-PrivateCluster/Terraform/All-in-One/**'
      - '.github/workflows/aks-secure-baseline-all-in-one.yml'
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Friendly name used for tagging Terraform resources"
        required: false
        default: "dev"
      apply:
        description: "Apply the Terraform plan after validation"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name || 'dev' }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name || 'dev' }}
      TF_VAR_resource_group_name: ${{ secrets.TF_VAR_resource_group_name }}
      TF_VAR_location: ${{ secrets.TF_VAR_location }}
      TF_VAR_prefix: ${{ secrets.TF_VAR_prefix }}
      TF_VAR_dns_prefix: ${{ secrets.TF_VAR_dns_prefix }}
      TF_VAR_vnet_address_space: ${{ secrets.TF_VAR_vnet_address_space }}
      TF_VAR_subnet_address_prefix: ${{ secrets.TF_VAR_subnet_address_prefix }}
      TF_VAR_kubernetes_version: ${{ secrets.TF_VAR_kubernetes_version }}
      TF_VAR_admin_username: ${{ secrets.TF_VAR_admin_username }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}
      TF_IN_AUTOMATION: true
    defaults:
      run:
        shell: bash
        working-directory: Scenarios/AKS-Secure-Baseline-PrivateCluster/Terraform/All-in-One

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
        run: terraform apply -auto-approve tfplan
